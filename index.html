<style>

--c1:#5b8bec;--c2:#c97524;--c3:#26a595;--ok:#62c996;--okbg:#17302400;--warn:#e3b64d;--warnbg:#33290f;--ser:#f0985a;--serbg:#38210f;--crit:#f27b72;--critbg:#3a1714;--grid:#252c37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101319;--surf:#181c24;--ink:#eef1f6;--ink2:#c5ccd8;--mut:#8f99a9;--line:#2a313d;--acc:#7da3f2;--accbg:#1d2740;
--c1:#5b8bec;--c2:#c97524;--c3:#26a595;--ok:#62c996;--okbg:#173024;--warn:#e3b64d;--warnbg:#33290f;--ser:#f0985a;--serbg:#38210f;--crit:#f27b72;--critbg:#3a1714;--grid:#252c37;color-scheme:dark}
*{box-sizing:border-box}

<div class="wrap">
<header>
<h1>Astro<span>Helix</span></h1>

<script>
//#core-start
/* AstroHelix core: parsing, statistics, NeuroEcho, dose mapping, simulation.
   Pure functions, no DOM. Tested against Python (scipy / scikit-learn). */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mean=a=>{let s=0;for(let i=0;i<a.length;i++)s+=a[i];return s/a.length;};
const sdv=(a,dd=1)=>{if(a.length<=dd)return 0;const m=mean(a);let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-m)*(a[i]-m);return Math.sqrt(s/(a.length-dd));};
const clip=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- special functions ---------- */
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x);}
function betacf(a,b,x){const EPS=3e-14,FP=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<FP)d=FP;d=1/d;let h=d;for(let m=1;m<=300;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function welch(a,b){const n1=a.length,n2=b.length,m1=mean(a),m2=mean(b);const v1=sdv(a,1),v2=sdv(b,1);const s1=v1*v1/n1,s2=v2*v2/n2,se2=s1+s2;
  if(!(se2>0))return {t:0,p:1,lfc:m2-m1};const t=(m2-m1)/Math.sqrt(se2);const df=se2*se2/((s1*s1)/(n1-1)+(s2*s2)/(n2-1));
  return {t,p:ibeta(df/(df+t*t),df/2,0.5),lfc:m2-m1};}
function bh(p){const n=p.length,o=Array.from(p.keys()).sort((i,j)=>p[i]-p[j]),r=new Float64Array(n);let m=1;for(let k=n-1;k>=0;k--){const v=p[o[k]]*n/(k+1);m=Math.min(m,v);r[o[k]]=Math.min(1,m);}return r;}
function ranks(a){const o=Array.from(a.keys()).sort((i,j)=>a[i]-a[j]),r=new Float64Array(a.length);let i=0;while(i<o.length){let j=i;while(j+1<o.length&&a[o[j+1]]===a[o[i]])j++;const v=(i+j)/2+1;for(let k=i;k<=j;k++)r[o[k]]=v;i=j+1;}return r;}
function pearson(a,b){const ma=mean(a),mb=mean(b);let sab=0,saa=0,sbb=0;for(let i=0;i<a.length;i++){sab+=(a[i]-ma)*(b[i]-mb);saa+=(a[i]-ma)**2;sbb+=(b[i]-mb)**2;}return sab/Math.sqrt(saa*sbb);}
const spearman=(a,b)=>pearson(ranks(a),ranks(b));

/* ---------- symmetric eigen-decomposition (cyclic Jacobi) ---------- */
function eigSym(A,n){const a=A.map(r=>Float64Array.from(r)),V=[];for(let i=0;i<n;i++){const r=new Float64Array(n);r[i]=1;V.push(r);}
  let scale=0;for(let i=0;i<n;i++)scale+=a[i][i]*a[i][i];scale+=1e-12;
  for(let sw=0;sw<80;sw++){let off=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)off+=a[i][j]*a[i][j];if(off<1e-26*scale)break;
    for(let p=0;p<n-1;p++)for(let q=p+1;q<n;q++){const apq=a[p][q];if(Math.abs(apq)<1e-300)continue;
      const th=(a[q][q]-a[p][p])/(2*apq),t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1)),c=1/Math.sqrt(t*t+1),s=t*c;
      for(let k=0;k<n;k++){const x=a[k][p],y=a[k][q];a[k][p]=c*x-s*y;a[k][q]=s*x+c*y;}
      for(let k=0;k<n;k++){const x=a[p][k],y=a[q][k];a[p][k]=c*x-s*y;a[q][k]=s*x+c*y;}
      for(let k=0;k<n;k++){const x=V[k][p],y=V[k][q];V[k][p]=c*x-s*y;V[k][q]=s*x+c*y;}}}
  const lam=new Float64Array(n);for(let i=0;i<n;i++)lam[i]=Math.max(0,a[i][i]);return {lam,Q:V};}

/* ---------- kernel ridge with leave-one-out alpha choice (equivalent to RidgeCV on standardised X) ---------- */
const ALPHAS=Array.from({length:15},(_,k)=>Math.pow(10,-1+4*k/14));
function prepSplit(X,tr,te){const ntr=tr.length,nte=te.length,p=X.length;
  const K=Array.from({length:ntr},()=>new Float64Array(ntr)),Kte=Array.from({length:nte},()=>new Float64Array(ntr));
  const vtr=new Float64Array(ntr),vte=new Float64Array(nte);
  for(let g=0;g<p;g++){const row=X[g];let m=0;for(let i=0;i<ntr;i++)m+=row[tr[i]];m/=ntr;let v=0;for(let i=0;i<ntr;i++){const d=row[tr[i]]-m;v+=d*d;}let s=Math.sqrt(v/ntr);if(s<1e-12)s=1;
    for(let i=0;i<ntr;i++)vtr[i]=(row[tr[i]]-m)/s;for(let t=0;t<nte;t++)vte[t]=(row[te[t]]-m)/s;
    for(let i=0;i<ntr;i++){const vi=vtr[i],Ki=K[i];for(let j=i;j<ntr;j++)Ki[j]+=vi*vtr[j];}
    for(let t=0;t<nte;t++){const vt=vte[t],Kt=Kte[t];for(let i=0;i<ntr;i++)Kt[i]+=vt*vtr[i];}}
  for(let i=0;i<ntr;i++)for(let j=0;j<i;j++)K[i][j]=K[j][i];
  return {tr,te,eig:eigSym(K,ntr),Kte};}
function fitSplit(sp,y){const {tr,eig}=sp,n=tr.length,{lam,Q}=eig;let yb=0;for(let i=0;i<n;i++)yb+=y[tr[i]];yb/=n;
  const yc=new Float64Array(n);for(let i=0;i<n;i++)yc[i]=y[tr[i]]-yb;
  const q=new Float64Array(n);for(let j=0;j<n;j++){let s=0;for(let i=0;i<n;i++)s+=Q[i][j]*yc[i];q[j]=s;}
  let best=Infinity,ba=ALPHAS[0];
  for(const a of ALPHAS){let mse=0;for(let i=0;i<n;i++){let yh=0,h=1/n;const Qi=Q[i];for(let j=0;j<n;j++){const w=lam[j]/(lam[j]+a);yh+=Qi[j]*w*q[j];h+=Qi[j]*Qi[j]*w;}const e=(yc[i]-yh)/(1-h);mse+=e*e;}
    if(mse<best){best=mse;ba=a;}}
  const alpha=new Float64Array(n);for(let i=0;i<n;i++){let s=0;for(let j=0;j<n;j++)s+=Q[i][j]*q[j]/(lam[j]+ba);alpha[i]=s;}
  return {yb,alpha,a:ba};}
function cvPredict(preps,y,n){const pred=new Float64Array(n);for(const sp of preps){const f=fitSplit(sp,y);for(let t=0;t<sp.te.length;t++){let s=f.yb;const Kt=sp.Kte[t];for(let i=0;i<sp.tr.length;i++)s+=Kt[i]*f.alpha[i];pred[sp.te[t]]=s;}}return pred;}
const r2score=(y,p)=>{const m=mean(y);let sse=0,sst=0;for(let i=0;i<y.length;i++){sse+=(y[i]-p[i])**2;sst+=(y[i]-m)**2;}return 1-sse/sst;};
const zscore=a=>{const m=mean(a),s=sdv(a,0);return Float64Array.from(a,v=>(v-m)/s);};

function makeFolds(n,k,seed,ids){let f;if(ids)f=ids.slice();else{const rng=mulberry32(seed||1),o=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(rng()*(i+1));[o[i],o[j]]=[o[j],o[i]];}f=new Array(n);o.forEach((idx,pos)=>f[idx]=pos%k);}
  const out=[];for(let c=0;c<k;c++){const te=[],tr=[];for(let i=0;i<n;i++)(f[i]===c?te:tr).push(i);if(te.length)out.push({tr,te});}return out;}

function neuroecho(X,y,opts={}){const n=y.length,k=opts.k||5,B=opts.nPerm==null?200:opts.nPerm;
  const folds=makeFolds(n,k,opts.seed,opts.foldIds);const preps=folds.map(f=>prepSplit(X,f.tr,f.te));
  const pred=cvPredict(preps,y,n);const r2=r2score(y,pred);let sse=0;for(let i=0;i<n;i++)sse+=(y[i]-pred[i])**2;const rmse=Math.sqrt(sse/n);const rho=spearman(y,pred);
  const rng=mulberry32((opts.seed||1)+99),perm=[];
  for(let b=0;b<B;b++){const yp=Float64Array.from(y);for(let i=n-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=yp[i];yp[i]=yp[j];yp[j]=t;}perm.push(r2score(yp,cvPredict(preps,yp,n)));}
  const pPerm=(1+perm.filter(v=>v>=r2).length)/(B+1);
  const all=Array.from({length:n},(_,i)=>i),full=prepSplit(X,all,[]);const ff=fitSplit(full,y);
  const coef=new Float64Array(X.length);for(let g=0;g<X.length;g++){const row=X[g];let m=0;for(let i=0;i<n;i++)m+=row[i];m/=n;let v=0;for(let i=0;i<n;i++)v+=(row[i]-m)**2;let s=Math.sqrt(v/n);if(s<1e-12)s=1;let w=0;for(let i=0;i<n;i++)w+=ff.alpha[i]*(row[i]-m)/s;coef[g]=w;}
  return {pred,r2,rmse,rho,perm,pPerm,coef,alpha:ff.a};}

/* ---------- differential expression ---------- */
function diffExpr(X,dose){const c=[],ir=[];dose.forEach((d,i)=>(d===0?c:ir).push(i));
  const lfc=new Float64Array(X.length),t=new Float64Array(X.length),p=new Float64Array(X.length);
  for(let g=0;g<X.length;g++){const r=welch(c.map(i=>X[g][i]),ir.map(i=>X[g][i]));lfc[g]=r.lfc;t[g]=r.t;p[g]=Number.isFinite(r.p)?r.p:1;}
  return {lfc,t,p,fdr:bh(p)};}

/* ---------- parsing ---------- */
function parseTable(text){text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/,1)[0];
  const cand=[',','\t',';'];let d=',',best=-1;for(const c of cand){const n=first.split(c).length;if(n>best){best=n;d=c;}}
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}
    else cur+=ch;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}
function parseDose(s){s=String(s==null?'':s).trim().toLowerCase();if(!s)return NaN;
  if(/sham|control|unirrad|non.?irrad|^0(\.0+)?$|^0\s*(gy|cgy|mgy)$/.test(s))return 0;
  const m=s.match(/(\d*\.?\d+)\s*(cgy|mgy|gy)/);if(m){const v=+m[1];return m[2]==='cgy'?v/100:m[2]==='mgy'?v/1000:v;}
  if(/^\d*\.?\d+$/.test(s))return +s;return NaN;}
const normName=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,'');
function buildDataset(exprText,metaText){const E=parseTable(exprText),M=parseTable(metaText),notes=[];
  if(E.length<10||E[0].length<5)throw new Error('Expression file: need a header row, genes as rows and at least 4 sample columns.');
  if(M.length<5)throw new Error('Metadata file: need a header row and one row per sample.');
  const head=E[0].map(s=>String(s).trim()),body=E.slice(1);
  const keep=[],annot=[];for(let j=1;j<head.length;j++){let ok=0,tot=0;for(let r=0;r<Math.min(200,body.length);r++){const v=body[r][j];if(v===undefined||v==='')continue;tot++;if(Number.isFinite(+v))ok++;}if(tot&&ok/tot>=0.9)keep.push(j);else annot.push(j);}
  const symCol=annot.find(j=>/symbol|gene.?name/i.test(head[j]));
  if(symCol!==undefined)notes.push("Gene labels taken from the '"+head[symCol]+"' column.");
  const mh=M[0].map(s=>String(s).trim()),Mb=M.slice(1);
  /* dose column: prefer a header containing 'dose', else any column whose values parse as doses */
  let di=-1;const scoreCol=i=>{const vals=Mb.map(r=>parseDose(r[i]));const ok=vals.filter(Number.isFinite);return {n:ok.length,distinct:new Set(ok).size,frac:ok.length/Mb.length};};
  const cands=mh.map((h,i)=>i).filter(i=>{const s=scoreCol(i);return s.frac>=0.8&&s.distinct>=2;});
  di=cands.find(i=>/dose/i.test(mh[i]));if(di===undefined)di=cands.find(i=>/factor|group|condition|radiation/i.test(mh[i]));if(di===undefined)di=cands[0];
  if(di===undefined)throw new Error("Metadata file: could not find a dose column. Add a column such as dose_gy with values like 0, 0.3, 0.6 (or text such as '0.3 Gy', 'Sham').");

/* ---------- pathways ---------- */
const PATHWAYS={"DNA damage response":["Tp53","Atm","Cdkn1a","Gadd45a","Chek2"],"DNA repair":["Brca1","Rad51","Xrcc1","Parp1","Mgmt"],"Oxidative stress defense":["Sod2","Nfe2l2","Gpx1","Cat","Hmox1"],"Epigenetic regulation (5hmC/TET)":["Tet1","Tet2","Tet3","Dnmt3a","Dnmt1"],"Synaptic plasticity":["Bdnf","Arc","Fos","Egr1","Camk2a","Gria1","Grin2b","Syn1"],"Neuroinflammation":["Il1b","Tnf","Gfap","Aif1","Il6"],"Apoptosis":["Bax","Bcl2","Casp3"],"Chromatin protection":["Hmgn1","Hmgb1","H2afx","Hmgb2"]};
const GENE2PW={};for(const [pw,gs] of Object.entries(PATHWAYS))for(const g of gs)GENE2PW[g.toUpperCase()]=pw;

/* ---------- NVI, dose mapping, simulation ---------- */
function groupsFromNVI(dose,nvi){const m=new Map();dose.forEach((d,i)=>{if(!m.has(d))m.set(d,[]);m.get(d).push(nvi[i]);});
  return Array.from(m.keys()).sort((a,b)=>a-b).map(d=>({dose:d,n:m.get(d).length,mean:mean(m.get(d)),sd:sdv(m.get(d),1)}));}
function nviAtDose(G,d){if(d<=0)return {v:G[0].dose===0?G[0].mean:0,sd:G[0].sd,zone:'control'};const last=G[G.length-1];
  if(d>=last.dose)return {v:last.mean,sd:last.sd,zone:'above'};
  for(let i=0;i<G.length-1;i++){if(d<=G[i+1].dose){const f=(d-G[i].dose)/(G[i+1].dose-G[i].dose);return {v:G[i].mean+f*(G[i+1].mean-G[i].mean),sd:G[i].sd+f*(G[i+1].sd-G[i].sd),zone:i===0?'below':'inside'};}}
  return {v:last.mean,sd:last.sd,zone:'above'};}
function simulate(G,o){const days=[],mol=[],neu=[],lo=[],hi=[],dose=[],zone=[];
  const cum=t=>o.rate*Math.max(t,0)*(1-o.shield)*o.gyPerSv*o.sens/1000;
  const f=t=>{const r=nviAtDose(G,cum(t));return {v:clip(r.v,0,100)*(1-o.protect),sd:r.sd*(1-o.protect),zone:r.zone};};
  for(let d=0;d<=180;d++){const m=f(d),n=f(d-o.lag);days.push(d);dose.push(cum(d));mol.push(m.v);neu.push(n.v);zone.push(m.zone);
    lo.push(clip(n.v-1.96*n.sd,0,100));hi.push(clip(n.v+1.96*n.sd,0,100));}
  return {days,dose,mol,neu,lo,hi,zone};}

/* ---------- full pipeline ---------- */
function computeAll(ds,targetMode,opts={}){

  if(targetMode==='cognition'&&ds.cog){raw=ds.cog.map(v=>-v);label='cognition score (inverted)';}
  else if(targetMode==='dose'){raw=ds.dose;label='dose (continuous)';}
  else{raw=ds.dose.map(d=>d>0?1:0);label='irradiated vs control (binary)';}
  const y=zscore(Float64Array.from(raw));
  const de=diffExpr(ds.X,ds.dose);
  const echo=neuroecho(ds.X,y,opts);
  const ctrl=[];ds.dose.forEach((d,i)=>{if(d===0)ctrl.push(echo.pred[i]);});
  const mu0=mean(ctrl);const gm=groupsFromNVI(ds.dose,Array.from(echo.pred));const mumax=Math.max(...gm.map(g=>g.mean));
  const span=(mumax-mu0)>1e-9?(mumax-mu0):1;const degenerate=!((mumax-mu0)>1e-9);
  const nvi=Array.from(echo.pred,v=>100*(v-mu0)/span);
  const groups=groupsFromNVI(ds.dose,nvi);
  const order=Array.from(echo.coef.keys()).sort((a,b)=>Math.abs(echo.coef[b])-Math.abs(echo.coef[a]));
  const signals=order.slice(0,12).map(i=>({gene:ds.genes[i],coef:echo.coef[i],pw:GENE2PW[ds.genes[i].toUpperCase()]||'-'}));
  const volcano=ds.genes.map((g,i)=>({gene:g,lfc:de.lfc[i],nlp:-Math.log10(de.p[i]+1e-300),sig:de.fdr[i]<0.1}));
  const pwRows=[];let mapped=0;
  for(const [pw,gs] of Object.entries(PATHWAYS)){const idx=[];for(const g of gs){const i=ds.genes.findIndex(x=>x.toUpperCase()===g.toUpperCase());if(i>=0)idx.push(i);}mapped+=idx.length;
    if(idx.length)pwRows.push({pw,n:idx.length,m:mean(idx.map(i=>Math.abs(de.lfc[i])))});}
  const mx=Math.max(...pwRows.map(r=>r.m),1e-9);pwRows.forEach(r=>r.hp=r.m/mx);
  const agg={};signals.forEach(s=>{});const pwW={};order.slice(0,200).forEach(i=>{const pw=GENE2PW[ds.genes[i].toUpperCase()];if(pw)pwW[pw]=(pwW[pw]||0)+Math.abs(echo.coef[i]);});
  const pwAgg=Object.entries(pwW).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([pw,v])=>({pw,v}));
  const bins=16,lo=Math.min(...echo.perm),hi=Math.max(...echo.perm),w=(hi-lo)/bins||1,counts=new Array(bins).fill(0);echo.perm.forEach(v=>{counts[Math.min(bins-1,Math.floor((v-lo)/w))]++;});
  const edges=Array.from({length:bins+1},(_,i)=>lo+i*w);
  return {ds,label,y,de,echo,nvi,groups,degenerate,signals,volcano,pwRows,mapped,pwAgg,perm:{counts,edges},foldN:5};}

const tip=document.getElementById('tip');
function showTip(t,x,y){tip.textContent=t;tip.style.display='block';const w=tip.offsetWidth;tip.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px';tip.style.top=Math.max(6,y-tip.offsetHeight-14)+'px';}
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t.dataset.tip,e.clientX,e.clientY);});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t.dataset.tip,e.clientX,e.clientY);else tip.style.display='none';});

/* ---------- chart helpers ---------- */
const W=360;
const lin=(d0,d1,r0,r1)=>v=>r0+(v-d0)/((d1-d0)||1)*(r1-r0);
function niceTicks(a,b,n=5){const span=b-a||1,st=Math.pow(10,Math.floor(Math.log10(span/n))),m=span/n/st,s=(m<1.5?1:m<3?2:m<7?5:10)*st;const out=[];for(let v=Math.ceil(a/s)*s;v<=b+1e-9;v+=s)out.push(+v.toFixed(10));return out;}
function axes(h,ml,mr,mt,mb,x0,x1,y0,y1,xl,yl,xt,yt){const X=lin(x0,x1,ml,W-mr),Y=lin(y0,y1,h-mb,mt);let s='';
 for(const v of (yt||niceTicks(y0,y1,4)))s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${ml-5}" y="${Y(v)+4}" text-anchor="end">${+v.toFixed(2)}</text>`;
 for(const v of (xt||niceTicks(x0,x1,5)))s+=`<text x="${X(v)}" y="${h-mb+15}" text-anchor="middle">${+v.toFixed(2)}</text>`;
 s+=`<text x="${(ml+W-mr)/2}" y="${h-2}" text-anchor="middle">${esc(xl)}</text><text transform="translate(11 ${(mt+h-mb)/2}) rotate(-90)" text-anchor="middle">${esc(yl)}</text>`;return {s,X,Y};}
function scatter(pts,o){const h=o.h||230,ml=40,mr=10,mt=8,mb=34;const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
 const x0=o.x0??Math.min(...xs),x1=o.x1??Math.max(...xs),y0=o.y0??Math.min(...ys),y1=o.y1??Math.max(...ys);const px=(x1-x0)*.05,py=(y1-y0)*.05;
 const a=axes(h,ml,mr,mt,mb,x0-px,x1+px,y0-py,y1+py,o.xl,o.yl);let s=a.s+(o.extra?o.extra(a):'');
 for(const p of pts)s+=`<circle cx="${a.X(p.x)}" cy="${a.Y(p.y)}" r="${p.r||3.5}" fill="${p.c}" fill-opacity=".85" stroke="var(--surf)" stroke-width="1.5"/><circle cx="${a.X(p.x)}" cy="${a.Y(p.y)}" r="11" fill="transparent" data-tip="${esc(p.t)}"/>`;
 return `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(o.label)}">${s}</svg>`;}

const poolSummary=R=>{const g=R.groups;return g.map(x=>`${x.dose} Gy: ${f1(x.mean)}`).join(' · ');};
function banner(){if(S.demo)return `<div class="banner demo"><b>Simulated example — not NASA data.</b> These numbers come from a computer-generated dataset made only to show the analysis steps working end to end. Do not read them as OSD-611 results. The OSD-611 tab shows the real study facts. Load the real OSD-611 tables in the <a href="#data">Data</a> tab to replace these numbers with real results.</div>`;return S.ds?`<div class="banner real"><b>Your data</b> · ${S.ds.samples.length} samples · ${S.ds.genes.length} genes. Every result below is computed from the files you loaded, in your browser.</div>`:'';}

function vHome(){const R=S.R;let res='';
 if(R){const e=R.echo,sig=R.de.fdr.filter(v=>v<.1).length;res=banner()+`<div class="card"><h3 style="margin-top:0">Results on your data</h3><div class="grid">

 return `<div class="card"><h2 style="margin-top:0">Can brain gene expression flag space-radiation stress early?</h2>
 <p>AstroHelix takes NASA's <b>OSD-611</b> study — mouse hippocampus after 28Si heavy-ion irradiation (0.3, 0.6, 0.9 Gy) — and turns it into a decision-support chain for crewed missions.</p>
 <ol style="padding-left:20px;color:var(--ink2);margin:6px 0">
 <li><b>OSD-611</b> – the real study: design, assays, samples, findings.</li>
 <li><b>NeuroEcho</b> – ridge regression, cross-validation and a permutation test on the expression table.</li>
 <li><b>Risk index (NVI)</b> – control = 0, most-affected dose group = 100.</li>
 <li><b>Resilience gap</b> – perturbed pathways next to what the tardigrade literature says.</li>

 ${R?'':`<div class="card"><h3 style="margin-top:0">Status</h3><p>Steps 1, 5 and 6 are available now. Steps 2–4 run as soon as the OSD-611 counts and sample tables are loaded in the <a href="#data">Data</a> tab.</p></div>`}`;}

function vStudy(){const rows=[['Study','OSD-611 (GeneLab ID GLDS-592), version 2'],['Title','Postsynaptic density radiation signature following space irradiation'],['Organism','Mus musculus, strain C57BL/6J (source: Jackson)'],['Tissue','Hippocampus'],['Samples','13 ('+SAMPLE_NAMES+')'],['Assays','RNA-seq (Illumina); DNA methylation profiling by DIP-seq (Illumina), two assays'],['Factors','Ionizing radiation; absorbed radiation dose'],['Project type','Ground study'],['Funding','NASA grants NNJ12ZSA001N, 80NSSC19K0498'],['Submitted / released','04 May 2023 / 16 Jan 2025'],['Processed data release','27 Feb 2026'],['DOI (dataset)','10.26030/t0z5-5g08'],['Paper','Impey et al. 2023, Frontiers in Physiology — PubMed 37440997, DOI 10.3389/fphys.2023.1215535']];
 const D=[[0.3,'Impaired','var(--crit)'],[0.6,'Not impaired','var(--ok)'],[0.9,'Not impaired','var(--ok)']];
 return `<h2>OSD-611: the real study</h2><div class="card"><div class="tablewrap"><table>${rows.map(r=>`<tr><th style="white-space:normal;width:34%">${r[0]}</th><td class="w" style="white-space:normal">${esc(r[1])}</td></tr>`).join('')}</table></div><p class="note">Source: the NASA OSDR study page for OSD-611.</p></div>
 <div class="card"><h3 style="margin-top:0">What the study found</h3><p>Mice were irradiated with <b>28Si ions (600 MeV/n)</b>, a heavy ion present in space radiation. The authors assessed cognitive performance and hippocampal gene expression and DNA hydroxymethylation (5hmC):</p>

 setTimeout(()=>{const r=document.getElementById('mdr');if(!r)return;const mv=e=>{const bb=r.getBoundingClientRect();const i=Math.max(0,Math.min(180,Math.round((e.clientX-bb.left)/bb.width*180)));showTip(`Day ${i} · ${cum(i).toFixed(0)} mSv · ${(cum(i)/6).toFixed(0)}% of 600 mSv`,e.clientX,e.clientY);};r.addEventListener('pointermove',mv);r.addEventListener('pointerdown',mv);r.addEventListener('pointerleave',()=>tip.style.display='none');},0);
 return `<h2>Mission dose</h2><div class="card"><p>Cumulative dose equivalent on a Mars-cruise leg, from NASA's measured rate. This part needs no dataset.</p>
 ${slider('rate','Dose-equivalent rate',0.3,3,0.1,v=>v.toFixed(1)+' mSv/day','1.8 = MSL RAD cruise measurement to Mars')}
 ${slider('shield','Shielding',0,0.6,0.05,v=>Math.round(v*100)+'%','reduces the dose in this calculator')}
 ${slider('q','Quality factor (Sv per Gy)',1,6,0.1,v=>v.toFixed(1),'assumption used only to estimate absorbed dose')}
 <svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Cumulative dose over 180 days">${s}</svg>
 <div class="grid" style="margin-top:8px"><div class="stat"><div class="k">180-day dose equivalent</div><div class="v">${tot.toFixed(0)} mSv</div><div class="n">${pct.toFixed(0)}% of 600 mSv limit</div></div>
 <div class="stat"><div class="k">≈ absorbed dose</div><div class="v">${gy.toFixed(3)} Gy</div><div class="n">vs lowest OSD-611 dose 0.3 Gy</div></div></div>
 <div class="warnbox">The mission-equivalent dose is well below the lowest dose measured in OSD-611 (0.3 Gy), so mapping brain effects to it is an extrapolation that the study cannot confirm.</div>
 <p class="note">Round trip ≈ 0.66 Sv (MSL RAD). NASA's 600 mSv career limit applies to all astronauts.</p></div>
 <div class="card"><h3 style="margin-top:0">Dose → brain index</h3><p class="note">Load the OSD-611 counts and sample tables in the <a href="#data">Data</a> tab to add the neural vulnerability index, three what-if scenarios and countermeasure hypotheses.</p></div>`;}
function vEvidence(){const R=S.R,e=R?R.echo:null,sig=R?R.de.fdr.filter(v=>v<.1).length:0;
 const items=[
  ['nasa','28Si ions, mice, 0 / 0.3 / 0.6 / 0.9 Gy; only 0.3 Gy impaired novel-object recognition; gene-expression and 5hmC changes in synaptic pathways (Impey et al. 2023, Frontiers in Physiology).'],
  ['nasa','NASA GeneLab links OSD-611 to a “radiation synaptic signature”.'],
  ['nasa','Mars-cruise GCR dose equivalent about 1.8 mSv/day (MSL RAD).'],
  ['nasa','NASA career dose limit 600 mSv.'],
  ['nasa','Dsup binds nucleosomes and shields DNA from hydroxyl radicals (Chavez et al. 2019); ~40% X-ray tolerance in HEK293 (Hashimoto et al. 2016).'],
  ...(R?[['model',`NeuroEcho cross-validated R² = ${fx(e.r2)}, permutation p = ${fx(e.pPerm,3)}.`],['model',`${sig} of ${R.ds.genes.length} genes differ at FDR < 0.1.`],['model',`NVI group means: ${poolSummary(R)}.`],['model','Dose–index mapping is a linear interpolation between measured groups.']]:[]),
  ['hyp','Dsup-like protection reduces neural vulnerability (scenario C).'],
  ['hyp','Index behaviour below the lowest measured dose (extrapolation).'],
  ['hyp','Tardigrade pathways transfer to mammalian neurons.']];
 const n={nasa:0,model:0,hyp:0};items.forEach(i=>n[i[0]]++);const tot=items.length;const nm={nasa:'NASA / published',model:'Model prediction',hyp:'Research hypothesis'};const col={nasa:'var(--ok)',model:'var(--acc)',hyp:'var(--warn)'};
 return banner()+`<h2>Evidence meter</h2><div class="card"><div class="bar" role="img" aria-label="Share of statements by evidence type">${['nasa','model','hyp'].map(k=>`<span style="width:${n[k]/tot*100}%;background:${col[k]}" data-tip="${nm[k]}: ${n[k]} of ${tot}"></span>`).join('')}</div>
 <div class="legend">${['nasa','model','hyp'].map(k=>`<span><i style="background:${col[k]}"></i>${nm[k]} (${n[k]})</span>`).join('')}</div>
 <p class="note">Counts statements used in this app. The model-prediction items are computed live from the data loaded now.</p></div>
 <div class="card">${items.map(i=>`<p style="margin:10px 0"><span class="badge t-${i[0]}">${nm[i[0]]}</span><br>${esc(i[1])}</p>`).join('')}</div>
 <div class="card"><h3 style="margin-top:0">Limitations</h3><ul><li>Not a diagnosis, prescription or individual risk estimate.</li><li>Mouse brain tissue after single-ion beams; space radiation is a mixed, low-dose-rate field.</li><li>OSD-611 has 13 samples, so cross-validated metrics are noisy; batch effects can dominate.</li><li>Absorbed dose per day is derived from an assumed quality factor.</li><li>Genes and pathways were chosen a priori; results are associations.</li></ul></div>`;}
const RENDER={home:vHome,study:vStudy,data:vData,echo:vEcho,index:vIndex,gap:vGap,mission:vMission,evidence:vEvidence};
function route(){const h=(location.hash||'#home').slice(1);return RENDER[h]?h:'home';}
function render(){const r=route();document.getElementById('nav').innerHTML=VIEWS.map(v=>`<a href="#${v[0]}" class="${v[0]===r?'on':''}">${v[1]}</a>`).join('');
 const el=document.getElementById('view');if(S.busy){el.innerHTML='<div class="busy">Computing… (t-tests, cross-validation, permutation test)</div>';return;}
 el.innerHTML=RENDER[r]();wire(r);}
function wire(r){
 document.querySelectorAll('input[type=range]').forEach(i=>i.addEventListener('input',()=>{const k=i.dataset.k;S.sim[k]=+i.value;const keep=scrollY;render();scrollTo(0,keep);}));
 const ts=document.getElementById('tsel');if(ts)ts.onchange=()=>{S.target=ts.value;recompute();};
 const ex=document.getElementById('ex');if(ex)ex.onclick=()=>{loadDemo();location.hash='#echo';};const dm=document.getElementById('demo');if(dm)dm.onclick=clearData;
 const go=document.getElementById('go');if(go)go.onclick=async()=>{const fe=document.getElementById('fe').files[0],fm=document.getElementById('fm').files[0];if(!fe||!fm){S.err='Choose both files first.';render();return;}
  try{const ds=buildDataset(await fe.text(),await fm.text());S.ds=ds;S.demo=false;S.target=ds.cog?'cognition':'binary';location.hash='#echo';recompute();}catch(e){S.err=e.message;render();}};}
addEventListener('hashchange',()=>{tip.style.display='none';render();scrollTo(0,0);});
loadDemo();
</script>
